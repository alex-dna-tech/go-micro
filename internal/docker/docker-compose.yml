# Builds the go-micro image locally from internal/docker/Dockerfile (compiles
# the micro CLI from source). No prebuilt binaries or remote image needed.

x-micro: &micro-build
  build:
    context: .
    dockerfile: Dockerfile
    additional_contexts:
      repo: ../..

# Shared registry/broker for all containers: NATS (see the nats service
# below). MICRO_REGISTRY/MICRO_BROKER point every service at it.
x-nats: &nats-env
  MICRO_REGISTRY: "nats"
  MICRO_REGISTRY_ADDRESS: "nats://nats:4222"
  MICRO_BROKER: "nats"
  MICRO_BROKER_ADDRESS: "nats://nats:4222"

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"

  gw:
    <<: *micro-build
    environment:
      <<: *nats-env
      MICRO_LOG_LEVEL: "debug"
      MICRO_AI_PROVIDER: "openai"
      MICRO_AI_BASE_URL: "http://llama:8000"
      MICRO_AI_MODEL: "MiniCPM5-1B-Q4_K_M"
      MICRO_AI_API_KEY: ""
      MICRO_ADMIN_USER: "admin"
      MICRO_ADMIN_PASSWORD: "micro"
    ports:
      - "8080:8080"
      - "3000:3000"
    volumes:
      - ./micro:/micro
    depends_on:
      - nats
    command: gateway --mcp-address :3000

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./llama-entrypoint.sh:/llama-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/llama-entrypoint.sh"]

  # Runs the services from /repo/micro.mu (services only — no gateway, no
  # HTTP listener of its own). The gw container owns the dashboard/API/MCP
  # gateway and proxies to these services through NATS.
  micro-run:
    <<: *micro-build
    working_dir: /repo
    environment:
      <<: *nats-env
      MICRO_ADMIN_USER: "admin"
      MICRO_ADMIN_PASSWORD: "micro"
    volumes:
      - ../../:/repo
    depends_on:
      - nats
    command: run --no-gateway --detach --no-watch
